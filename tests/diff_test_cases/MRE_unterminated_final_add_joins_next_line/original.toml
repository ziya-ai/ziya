[tool.poetry]
name = "ziya"
version = "0.8.8.8"
description = "Self-hosted AI workbench. Runs alongside your editor, not instead of it. The surface next to your editor where conversations, architecture work, diff review, and visual debugging happen."
authors = ["Dan Cohn <chroma@gmail.com>",
           "Vishnu Krishnaprasad <vishnukool@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/ziya-ai/ziya"
repository = "https://github.com/ziya-ai/ziya"
keywords = ["ai", "llm", "coding", "architecture", "operations", "visualization", "self-hosted", "bedrock", "claude", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "License :: OSI Approved :: MIT License",
]

packages = [
    { include = "app", from = "." },
